name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "20"
          cache: npm
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check
      - run: git diff --exit-code -- plugins/codex-search-bridge/dist plugins/codex-search-bridge/schemas
      - name: Build release archives
        shell: bash
        run: |
          mkdir -p artifacts/stage
          cp -a plugins/codex-search-bridge artifacts/stage/
          cp LICENSE README.md README.zh-CN.md artifacts/stage/codex-search-bridge/
          tar -C artifacts/stage -czf "artifacts/codex-search-bridge-${GITHUB_REF_NAME}.tar.gz" codex-search-bridge
          (cd artifacts/stage && zip -qr "../codex-search-bridge-${GITHUB_REF_NAME}.zip" codex-search-bridge)
          (cd artifacts && sha256sum *.tar.gz *.zip > SHA256SUMS.txt)
          rm -rf artifacts/stage
      - name: Publish to npm
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -z "${NODE_AUTH_TOKEN}" ]]; then
            echo "NPM_TOKEN is not configured; skipping the npm publish step."
            exit 0
          fi
          published="$(npm view "codex-search-bridge@${GITHUB_REF_NAME#v}" version 2>/dev/null || true)"
          if [[ -n "$published" ]]; then
            echo "codex-search-bridge@${GITHUB_REF_NAME#v} is already on npm; skipping."
            exit 0
          fi
          npm publish --provenance --access public
      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes_file="docs/launch/release-${GITHUB_REF_NAME}.md"
          if [[ -f "$notes_file" ]]; then
            notes_args=(--notes-file "$notes_file")
          else
            notes_args=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" \
            artifacts/codex-search-bridge-*.tar.gz \
            artifacts/codex-search-bridge-*.zip \
            artifacts/SHA256SUMS.txt \
            --verify-tag \
            --title "Codex Search Bridge $GITHUB_REF_NAME" \
            "${notes_args[@]}"
