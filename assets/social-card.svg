      <text x="80" y="89" fill="#F2F7F5" font-size="16" font-weight="700">SEARCH</text>
      <text x="80" y="113" fill="#9FB4AE" font-size="12">event observed</text>

      <circle cx="50" cy="182" r="9" fill="#22D3C5"/>
