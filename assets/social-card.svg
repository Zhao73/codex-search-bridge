  </text>
  <text x="62" y="394" fill="#9FB4AE" font-family="Arial, Helvetica, sans-serif" font-size="21">
    MARK WHAT IS UNCONFIRMED.
  </text>

  <g transform="translate(62 470)" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="600">
