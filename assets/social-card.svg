<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Codex Search Bridge social preview</title>
  <desc id="desc">Launch card showing a tool-capable model connected to verified live-web search evidence.</desc>
  <rect width="1200" height="630" fill="#07110F"/>

  <g transform="translate(58 46)">
    <rect width="28" height="34" rx="3" fill="#10201C" stroke="#F2F7F5" stroke-width="3"/>
    <rect x="48" width="28" height="34" rx="3" fill="#10201C" stroke="#F2F7F5" stroke-width="3"/>
    <path d="M14 17 H33 V9 H43 V17 H62" fill="none" stroke="#22D3C5" stroke-width="4"/>
